<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alibaba API · Alibaba Lab</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="/lab.css"></head>
<body><main class="container py-4">
<nav class="nav nav-pills mb-4"><a class="nav-link" href="/">Аудиоанализ</a><a class="nav-link active" href="/chat.html">Alibaba API</a></nav>
<h1>Alibaba API</h1>
<label for="model" class="form-label">Модель</label>
<div class="input-group"><select id="model" class="form-select" disabled><option value="">Загрузка моделей…</option></select><button id="refresh" class="btn btn-outline-primary">Проверить ключ и список</button></div>
<p id="availability" class="mt-2" role="status"></p>
<p id="recommendation"></p>
<div class="d-flex flex-wrap align-items-center gap-3 mb-3">
<label class="form-check"><input class="form-check-input" type="checkbox" id="thinking" checked> Отключить thinking</label>
<button id="bench" class="btn btn-outline-primary" disabled>Сравнить скорость моделей</button>
<button id="reset" class="btn btn-outline-secondary">Сбросить чат</button></div>
<div id="bench-results" role="status" class="mb-3"></div>
<div id="dialog" class="border rounded p-3 mb-3" role="log"></div>
<form id="chat"><label for="prompt" class="form-label">Сообщение</label><textarea id="prompt" class="form-control mb-2" rows="3" required maxlength="20000"></textarea>
<button type="submit" class="btn btn-primary" disabled>Отправить</button> <button id="stop" type="button" class="btn btn-outline-secondary" disabled>Остановить</button></form>
<p id="timing" class="mt-3" role="status"></p></main>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script><script src="/chat.js?v=2"></script></body></html>
