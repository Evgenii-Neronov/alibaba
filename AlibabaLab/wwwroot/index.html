<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Аудиоанализ · Alibaba Lab</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="/lab.css"></head>
<body><main class="container py-4">
<nav class="nav nav-pills mb-4"><a class="nav-link active" href="/">Аудиоанализ</a><a class="nav-link" href="/chat.html">Alibaba API</a></nav>
<h1>Аудиоанализ</h1>
<form id="upload" class="row g-2 my-3">
<div class="col"><input class="form-control" id="file" type="file" accept="audio/*,video/mp4,.mp3,.mp4" required aria-label="Аудио или MP4"></div>
<div class="col-auto"><button class="btn btn-primary">Открыть запись</button></div></form>
<p id="status" role="status"></p>
<section id="analysis" hidden>
<audio id="player" class="w-100" controls></audio>
<label for="zoom" class="form-label mt-3">Масштаб <span id="zoom-value"></span></label>
<input id="zoom" class="form-range" type="range" min="0" max="7" value="0">
<div id="wave-scroll" class="overflow-auto border rounded"><canvas id="wave" aria-label="Осциллограмма записи"></canvas></div>
<p class="mt-2 text-secondary">Щелчок по осциллограмме перемещает курсор воспроизведения. Поля времени можно уточнять вручную.</p>
<div class="row g-2 align-items-end">
<div class="col-sm"><label for="end">Конец реплики, с</label><div class="input-group"><input id="end" type="number" class="form-control" min="0" step=".001"><button type="button" data-mark="end" class="btn btn-outline-primary">С курсора</button></div></div>
<div class="col-sm"><label for="start">Начало ответа, с</label><div class="input-group"><input id="start" type="number" class="form-control" min="0" step=".001"><button type="button" data-mark="start" class="btn btn-outline-primary">С курсора</button></div></div>
<div class="col-sm-auto"><button id="record" class="btn btn-primary">Добавить замер</button></div></div>
<p id="metrics" class="mt-3" role="status"></p>
<table class="table"><thead><tr><th>Конец реплики</th><th>Начало ответа</th><th>Задержка</th><th></th></tr></thead><tbody id="marks"></tbody></table>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script><script src="/audio.js"></script></body></html>
